    <script>
      // Defensive fix for Chrome extensions attempting direct assignment to window.fetch
      (function() {
        try {
          var _currentFetch = window.fetch;
          var targets = [window, Object.getPrototypeOf(window), Window.prototype];
          for (var i = 0; i < targets.length; i++) {
            var target = targets[i];
            if (target) {
              try {
                Object.defineProperty(target, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() { return _currentFetch; },
                  set: function(val) { _currentFetch = val; }
                });
              } catch (err) {}
            }
          }
        } catch (e) {}
      })();
    </script>
